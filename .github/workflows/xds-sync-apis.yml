name: Sync xDS APIs with upstream

permissions:
  contents: read

on:
  schedule:
    # every monday at 10:00 am (KST)
    - cron:  '0 1 * * 1'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Force a specific envoy version (leave empty for auto-detect)'
        required: false
        type: string

jobs:
  envoy-versions:
    if: ${{ inputs.target_version == '' }}
    uses: ./.github/workflows/xds-compare-versions.yml

  call-update-protobuf:
    permissions:
      contents: write
      pull-requests: write
    needs: envoy-versions
    if: >-
      always() &&
      (inputs.target_version != '' || needs.envoy-versions.outputs.should_update == 'true')
    uses: ./.github/workflows/xds-apply-updates.yml
    with:
      target_version: ${{ inputs.target_version || needs.envoy-versions.outputs.target_version }}
    secrets: inherit
